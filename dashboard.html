<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard - RoadAssist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
<div class="logo">🚗 RoadAssist</div>
<div><span class="welcome">Hi, {{ user_name }}</span><a href="{{ url_for('logout') }}">Logout</a></div>
</nav>

<main class="container">
<h1>User Dashboard</h1>
<p>Select your vehicle problem and request help.</p>

<div class="problem-grid">
<button class="problem-btn" onclick="selectProblem('Flat Tyre')">🛞<br>Flat Tyre</button>
<button class="problem-btn" onclick="selectProblem('Battery Problem')">🔋<br>Battery Problem</button>
<button class="problem-btn" onclick="selectProblem('Engine Problem')">⚙️<br>Engine Problem</button>
<button class="problem-btn" onclick="selectProblem('Fuel Empty')">⛽<br>Fuel Empty</button>
<button class="problem-btn" onclick="selectProblem('Accident')">🚨<br>Accident</button>
<button class="problem-btn" onclick="selectProblem('Other')">🔧<br>Other</button>
</div>

<div id="selectedProblem" class="selected-box">No problem selected.</div>
<button class="btn" onclick="requestHelp()">📍 Request Help</button>
<div id="message" class="message"></div>

<section class="status-card">
<h2>📋 Request Status</h2>
<div id="statusBox">No request yet.</div>
</section>

<section id="feedbackCard" class="feedback-card hidden">
<h2>⭐ Rate Your Service</h2>
<p>Please rate the mechanic after your request is completed.</p>
<div id="stars" class="stars">
  <button onclick="setRating(1)">★</button>
  <button onclick="setRating(2)">★</button>
  <button onclick="setRating(3)">★</button>
  <button onclick="setRating(4)">★</button>
  <button onclick="setRating(5)">★</button>
</div>
<textarea id="feedbackText" placeholder="Write your feedback..."></textarea>
<button class="btn" onclick="submitFeedback()">Submit Feedback</button>
<div id="feedbackMessage"></div>
</section>
</main>

<script>
let selectedProblem = "";
let currentRequestId = null;
let selectedRating = 0;

function selectProblem(problem) {
  selectedProblem = problem;
  document.getElementById("selectedProblem").textContent = "Selected: " + problem;
}

function requestHelp() {
  if (!selectedProblem) {
    document.getElementById("message").textContent = "Please select a problem first.";
    return;
  }

  const sendRequest = (lat, lon) => {
    fetch("/submit-request", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        problem: selectedProblem,
        latitude: lat,
        longitude: lon
      })
    })
    .then(r => r.json())
    .then(data => {
      document.getElementById("message").textContent = data.message || "Request submitted.";
      loadLatestRequest();
    })
    .catch(() => {
      document.getElementById("message").textContent = "Could not submit request.";
    });
  };

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => sendRequest(p.coords.latitude, p.coords.longitude),
      () => sendRequest(null, null)
    );
  } else {
    sendRequest(null, null);
  }
}

function loadLatestRequest() {
  fetch("/latest-request")
    .then(r => r.json())
    .then(data => {
      if (!data.success) return;

      currentRequestId = data.id;

      let html =
        "<p><b>Request ID:</b> #" + data.id + "</p>" +
        "<p><b>Problem:</b> " + data.problem + "</p>" +
        "<p><b>Status:</b> <strong>" + data.status + "</strong></p>";

      if (data.latitude && data.longitude) {
        html += '<p><a target="_blank" href="https://www.google.com/maps?q=' +
          data.latitude + ',' + data.longitude + '">📍 View Location</a></p>';
      }

      document.getElementById("statusBox").innerHTML = html;

      if (data.status === "Completed") {
        document.getElementById("feedbackCard").classList.remove("hidden");
      } else {
        document.getElementById("feedbackCard").classList.add("hidden");
      }
    });
}

function setRating(rating) {
  selectedRating = rating;
  document.querySelectorAll("#stars button").forEach((btn, index) => {
    btn.classList.toggle("active", index < rating);
  });
}

function submitFeedback() {
  if (!currentRequestId) {
    document.getElementById("feedbackMessage").textContent = "No completed request found.";
    return;
  }
  if (!selectedRating) {
    document.getElementById("feedbackMessage").textContent = "Please select a star rating.";
    return;
  }

  fetch("/submit-feedback", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      request_id: currentRequestId,
      rating: selectedRating,
      comment: document.getElementById("feedbackText").value
    })
  })
  .then(async r => {
    const data = await r.json().catch(() => ({success:false, message:"Server error."}));
    if (!r.ok) throw new Error(data.message || "Feedback could not be submitted.");
    return data;
  })
  .then(data => {
    document.getElementById("feedbackMessage").textContent = data.message;
  })
  .catch(err => {
    document.getElementById("feedbackMessage").textContent = "❌ " + err.message;
  });
}

loadLatestRequest();
setInterval(loadLatestRequest, 3000);
</script>
</body>
</html>
