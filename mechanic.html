<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mechanic Dashboard - RoadAssist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
<div class="logo">🔧 RoadAssist Mechanic</div>
<a href="{{ url_for('home') }}">Home</a>
</nav>

<main class="container">
<h1>🔧 Mechanic Dashboard</h1>
<p>Customer Breakdown Requests</p>
<div id="requests">Loading requests...</div>
</main>

<script>
function loadRequests() {
  fetch("/mechanic-requests")
    .then(r => r.json())
    .then(requests => {
      const box = document.getElementById("requests");

      if (!requests.length) {
        box.innerHTML = '<div class="empty">No pending or accepted requests.</div>';
        return;
      }

      box.innerHTML = requests.map(r => `
        <div class="request-card">
          <h2>Request #${r.id}</h2>
          <p><b>Customer:</b> ${r.customer_name || "Unknown"}</p>
          <p><b>Phone:</b> ${r.phone || "Not available"}</p>
          <p><b>Vehicle No:</b> ${r.vehicle_no || "Not available"}</p>
          <p><b>Vehicle Type:</b> ${r.vehicle_type || "Not available"}</p>
          <p><b>Problem:</b> ${r.problem}</p>
          <p><b>Status:</b> <strong>${r.status}</strong></p>
          <p><b>Time:</b> ${r.created_at}</p>
          ${r.latitude && r.longitude ?
            `<a target="_blank" class="map-link" href="https://www.google.com/maps?q=${r.latitude},${r.longitude}">📍 Open Customer Location</a>` :
            "<p>📍 Location not available</p>"
          }
          <div class="action-row">
          ${r.status === "Pending" ?
            `<button class="btn" onclick="acceptRequest(${r.id})">Accept Request</button>` :
            `<button class="btn complete" onclick="completeRequest(${r.id})">Complete Request</button>`
          }
          </div>
        </div>
      `).join("");
    })
    .catch(() => {
      document.getElementById("requests").innerHTML = '<div class="error">Could not load requests.</div>';
    });
}

function acceptRequest(id) {
  fetch("/accept-request/" + id, {method:"POST"})
    .then(r => r.json())
    .then(data => {
      alert(data.message);
      loadRequests();
    });
}

function completeRequest(id) {
  fetch("/complete-request/" + id, {method:"POST"})
    .then(r => r.json())
    .then(data => {
      alert(data.message);
      loadRequests();
    });
}

loadRequests();
setInterval(loadRequests, 5000);
</script>
</body>
</html>
