<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - RoadAssist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="form-page">
<div class="form-card">
<h1>🚗 Create Account</h1>
<p>Register your vehicle to request roadside assistance.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
<input type="text" name="name" placeholder="Full Name" required>
<input type="tel" name="phone" placeholder="Phone Number" required>
<input type="email" name="email" placeholder="Email Address" required>
<input type="password" name="password" placeholder="Password" required>
<input type="text" name="vehicle_no" placeholder="Vehicle Number" required>
<select name="vehicle_type" required>
<option value="">Select Vehicle Type</option>
<option>Car</option>
<option>Bike</option>
<option>Auto Rickshaw</option>
<option>Truck</option>
<option>Bus</option>
<option>Van</option>
<option>Other</option>
</select>
<button class="btn full" type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
</div>
</body>
</html>
