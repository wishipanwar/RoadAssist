<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadAssist - Login</title>

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eaf3ff, #ffffff);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 90%;
        max-width: 420px;
    }

    .card {
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }

    .logo {
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        color: #0d6efd;
        margin-bottom: 10px;
    }

    h2 {
        text-align: center;
        margin-bottom: 8px;
        color: #333;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #0d6efd;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 7px;
        background: #0d6efd;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
    }

    button:hover {
        background: #0b5ed7;
    }

    .error {
        background: #f8d7da;
        color: #842029;
        padding: 12px;
        border-radius: 7px;
        margin-bottom: 18px;
        text-align: center;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
        color: #555;
    }

    .register-link a {
        color: #0d6efd;
        text-decoration: none;
        font-weight: bold;
    }

    .home-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #555;
        text-decoration: none;
    }

    .home-link:hover,
    .register-link a:hover {
        text-decoration: underline;
    }
</style>
```

</head>

<body>

<div class="container">

```
<div class="card">

    <div class="logo">
        🚗 RoadAssist
    </div>

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to request roadside assistance
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form action="/login" method="POST">

        <div class="form-group">
            <label for="email">📧 Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">🔒 Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="/register">Register Now</a>
    </div>

    <a href="/" class="home-link">
        ← Back to Home
    </a>

</div>
```

</div>

</body>
</html>
